<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:khaki
        }
        div#area{
            background-color:black;
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-size: 18px;
            font-family:Arial, Helvetica, sans-serif;
        

        }
    </style>
</head>
<body>
    <h1>Eventos DOM</h1>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="saiu">interaja</div>
    <p>Evento DOM: O mouseenter; mouseout; mousemove; mouseup; mousedown; click</p>
<script>
    function clicar(){
        var a = document.getElementById('area')
        a.innerHTML = 'Clicou'
    }
    function entrar(){
        var a = document.getElementById('area')
        a.innerHTML = 'Entrou'
        a.style.background = 'blue'
    }
    function saiu(){
        var a = document.querySelector('div#area')
        a.innerHTML = 'Saiu'
    }
</script>
</body>
</html>
